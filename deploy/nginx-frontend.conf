# Serveur frontal : export statique Next.js (dist/) avec pages en .html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/includes/headers.conf;

    # L'API est servie par le conteneur backend via ce proxy : l'API et le site partagent
    # le même domaine, aucun CORS à configurer. NEXT_PUBLIC_API_URL doit alors valoir
    # l'URL publique du site lui-même (ex. https://myloc.dz).
    # Upstream via variable + resolver Docker : le backend est résolu à chaque requête et
    # NON au démarrage — sinon Nginx refuse de démarrer quand le conteneur backend est absent.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:80;
        # L'IP visiteur : derrière Traefik (dokploy-network), X-Forwarded-For vaut
        # « <IP du visiteur ou falsifiée>, <IP réelle du visiteur> » — Traefik ajoute la vraie
        # en dernier. Avec realip, $remote_addr devient cette dernière valeur ; on transmet
        # UNE seule entrée au backend (les limiteurs par IP fonctionnent alors par visiteur).
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 8m;
    }

    # La racine doit servir index.html : avec try_files seul, « / » tombait dans le
    # fallback 404.html (c'est la page 404 « This page could not be found »).
    # Pages HTML : toujours revalidées, sinon Safari peut garder une ancienne version du site
    # (qui charge d'anciens fichiers JS) après un déploiement. add_header dans un location
    # remplace ceux du serveur : on réinclut donc les en-têtes de sécurité.
    location = / {
        try_files /index.html =404;
        include /etc/nginx/includes/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri.html /404.html;
        include /etc/nginx/includes/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # D'abord les images statiques du site (décor, scènes, photos catalogue) servies
    # par l'export Next.js ; sinon proxy vers le backend pour les photos de véhicules
    # uploadées par l'agence (volume « uploads», publiées sous /images/cars/).
    # (les deux arborescences ne se recouvrent pas : upload = images/cars/car-*.ext)
    location /images/ {
        try_files $uri @images_backend;
    }
    location @images_backend {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_images http://backend:80;
        proxy_pass $backend_images;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Les chunk Next.js contiennent un hash : cache long.
    location /_next/static/ {
        try_files $uri =404;
        include /etc/nginx/includes/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}