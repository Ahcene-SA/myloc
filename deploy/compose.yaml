# MYLOC.DZ — stack complète pour Dokploy (type « Docker Compose »).
#
# Dans l'onglet Environment de Dokploy, définir :
#   NEXT_PUBLIC_API_URL=https://TON-DOMAINE       (URL du site lui-même ; l'API est servie
#                                                  sur le même domaine via le proxy /api)
#   JWT_SECRET=<longe chaîne aléatoire 32+ caractères>
#   DB_PASS=<mot de passe MariaDB>
#   ADMIN_EMAIL=contact@myloc.dz
#   ADMIN_PASSWORD=<mot de passe admin /agence>
#   (ALLOWED_ORIGINS/MAIL_*/WHATSAPP_* optionnels — voir deploy/README.md)
#
# ATTENTION : NEXT_PUBLIC_* est inliné au moment du build — le changer demande un re-déploiement.

services:
  mariadb:
    image: mariadb:11
    environment:
      # :? = la stack refuse de démarrer sans mot de passe réel (pas de fallback dev en production).
      MARIADB_ROOT_PASSWORD: ${DB_PASS:?DB_PASS requis (onglet Environment Dokploy)}
      MARIADB_DATABASE: ${DB_NAME:-myloc_db}
      MARIADB_USER: ${DB_USER:-myloc}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS requis (onglet Environment Dokploy)}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dokploy-network
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_TIMEZONE: Africa/Algiers
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-myloc_db}
      DB_USER: ${DB_USER:-myloc}
      DB_PASS: ${DB_PASS:?DB_PASS requis (onglet Environment Dokploy)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (32+ caractères aléatoires)}
      JWT_EXPIRY: "86400"
      # Liste blanche CORS réelle (CorsMiddleware) : le site est sur son propre domaine ;
      # ahcene-sa.github.io si le site est servi depuis GitHub Pages. Vide en dev = « * ».
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://mylocdz.com,https://ahcene-sa.github.io}
      RATE_LIMIT_MAX_ATTEMPTS: "5"
      RATE_LIMIT_WINDOW_SECONDS: "900"
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-tls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-contact@myloc.dz}
      MAIL_FROM_NAME: MYLOC.DZ
      AGENCY_NOTIFY_EMAIL: ${AGENCY_NOTIFY_EMAIL:-}
      AGENCY_PHONE: ${AGENCY_PHONE:-}
      # Alerte WhatsApp à l'agence à chaque réservation (voir deploy/README.md) :
      # driver=log par défaut (message écrit dans logs/whatsapp/, rien n'est envoyé).
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-log}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-reservation}
      WHATSAPP_LANG: ${WHATSAPP_LANG:-fr}
      WHATSAPP_APIKEY: ${WHATSAPP_APIKEY:-}
      CURRENCY: DA
      FRONTEND_URL: ${FRONTEND_URL:-}
      PAGE_SUFFIX: .html
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@myloc.dz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/var/www/html/public/images
    networks:
      - dokploy-network
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - backend
    # Tout le monde sur dokploy-network seulement : Traefik (qui vit sur ce réseau) voit
    # une seule IP possible et le DNS de service (backend, mariadb) reste disponible.
    # Pas de ports publié : le site passe par Traefik (TLS) ; les essais locaux utilisent
    # compose.override.yaml (8081/8082), jamais un port HTTP en clair accessible de l'extérieur.
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    restart: unless-stopped

volumes:
  mariadb_data:
  uploads:

networks:
  dokploy-network:
    external: true