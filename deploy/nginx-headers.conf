# En-têtes de sécurité — inclus dans le server ET dans les locations qui définissent
# leur propre add_header (Nginx : une location avec add_header hérite de RIEN du dessus).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP : par défaut tout du même domaine ; les scripts/styles inline de Next.js acceptés
# (export statique) ; connect-src inclut l'API si le site est hébergé ailleurs (GitHub Pages).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://mylocdz.com http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;